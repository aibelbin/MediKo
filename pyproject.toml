[project]
name = "mediko"
version = "0.1.0"
description = "Medical report information-extraction research prototype"
requires-python = ">=3.11"
dependencies = [
    "paddlepaddle==3.2.0",
    "paddleocr>=3.3.1",
    "pypdf>=5.1.0",
    "pypdfium2>=4.30.0",
    "numpy>=1.26",
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mediko = "mediko.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
